syntax = "proto3";

import "google/protobuf/timestamp.proto";
package percolator.contracts;

option csharp_namespace = "Percolator.Contracts";

// The top-level generic envelope for all internal, post-decryption messages.
// Note: HandshakeInitiatorHello is NOT carried inside InternalEnvelope.
// It is a standalone message used to bootstrap X3DH before a direct session exists.
message InternalEnvelope {
  // Sender context for cryptographic operations (e.g., SenderKey distribution).
  // These fields are encrypted inside the transport layer and are only visible to the recipient.
  optional bytes source_peer_id = 100;    // 16-byte UUID of the sender
  optional uint32 source_device_id = 101; // Sender's device ID (e.g., 1)

  oneof application_payload {
    ChatEnvelope chat_envelope = 1;
    DhtEnvelope dht_envelope = 3;
    PrekeyEnvelope prekey_envelope = 4;
    SubmitPreKeyBundleResponse submit_pre_key_bundle_response = 5;
    GetPreKeyBundleResponse get_pre_key_bundle_response = 6;
    MessageQueueEnvelope message_queue_envelope = 7;
    EnqueueOpaqueMessageResponse enqueue_opaque_message_response = 8;
    FetchQueuedMessagesResponse fetch_queued_messages_response = 9;
    // Host relay wrapper carrying inner opaque payload
    RelayOpaqueEnvelope relay_opaque_envelope = 10;
    RelayOpaqueResponse relay_opaque_response =11;
  }
}

// Explicit group creation prior to any administrative operations.
message CreateGroup {
  optional uint32 version = 100;
  // ConversationId (GUID bytes) chosen by the creator to identify the group across peers
  optional bytes conversation_id = 1;
  // Initial participant identity public keys (SPKI bytes). Include the creator's identity key as well.
  repeated bytes initial_participant_identity_keys = 2;
  // Optional human-readable name
  optional string name = 3;
  // Explicit creator identity key (SPKI bytes). Used to seed the initial admin key on all nodes.
  optional bytes creator_identity_key = 4;
}

// === 1. Rich Text Chat Application ===

message ProfileData {
  optional string display_name = 1;
}

message ChatEnvelope {
  optional uint32 version = 100; // Top-level version for chat envelope
  optional bytes profile_key = 10;
  optional bytes encrypted_profile_data = 11;
  optional bytes profile_nonce = 12;
  optional bytes profile_tag = 13;
  optional int32 profile_revision = 14;
  oneof message {
    CreateGroup create_group = 16; // explicit group creation before any admin ops
    TextMessage text_message = 1;
    ReadReceipt read_receipt = 2;
    EmojiAnnotation emoji_annotation = 3;
    DeliveredReceipt delivered_receipt = 8;
    // Group ciphertext message
    GroupMessage group_message = 17;
    // Group invitation message
    GroupInvite group_invite = 18;
  }
}

message TextMessage {
  bytes message_id = 1; // A unique identifier for the message.
  optional bytes author_identity_key = 2; // Required for group messages.
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  string content = 4;
  // Optional PublicIdentityId (UUID bytes) for 1:1 routing when no direct session exists (e.g., queued delivery)
  optional bytes public_identity_id = 5;
}

message ReadReceipt {
  bytes message_id = 1; // The ID of the message being acknowledged.
  optional bytes author_identity_key = 2; // Who is acknowledging the message.
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  // Optional PublicIdentityId (UUID bytes) for 1:1 routing when no direct session exists
  optional bytes public_identity_id = 4;
}

message EmojiAnnotation {
  bytes message_id = 1; // The ID of the message being annotated.
  optional bytes author_identity_key = 2; // Who is adding the annotation.
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  string emoji = 4; // The emoji character, e.g., "👍".
  // Optional PublicIdentityId (UUID bytes) for 1:1 routing when no direct session exists
  optional bytes public_identity_id = 5;
}

// Delivery receipt acknowledging that a message was delivered (distinct from read)
message DeliveredReceipt {
  bytes message_id = 1; // The ID of the message being acknowledged as delivered.
  optional bytes author_identity_key = 2; // Who is acknowledging delivery (for group contexts).
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  // Optional PublicIdentityId (UUID bytes) for 1:1 routing when no direct session exists
  optional bytes public_identity_id = 4;
}

// Group ciphertext message
message GroupMessage {
  optional uint32 version = 100;
  bytes message_id = 1; // Unique identifier for the message
  optional bytes author_identity_key = 2; // Sender's identity key
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  // ConversationId (GUID bytes) for DB lookup / routing within the app
  optional bytes conversation_id = 4;
  // The 32-byte derived group identifier (for cryptographic validation)
  optional bytes group_id = 5;
  // The ciphertext bytes (encrypted using group protocol)
  optional bytes ciphertext = 6;
  // Optional epoch number for key rotation tracking
  optional uint32 epoch = 7;
}

// Group invitation message carrying cryptographic bootstrap data.
// Sent to invite a new member to an existing group conversation.
message GroupInvite {
  optional uint32 version = 100;
  // ConversationId (GUID bytes) for the group being joined
  optional bytes conversation_id = 1;
  // The inviter's PublicIdentityId (UUID bytes)
  optional bytes inviter_public_identity_id = 2;
  // The encrypted GroupMasterKey (encrypted for the invitee)
  optional bytes group_master_key = 3;
  // Sender key distribution message for the group
  optional bytes sender_key_distribution = 4;
  // The relay's PublicIdentityId (UUID bytes) for group provisioning
  optional bytes relay_public_identity_id = 5;
  // Optional group name
  optional string name = 6;
  // The relay's hostname for network routing
  optional string relay_host = 7;
  // The relay's port for network routing
  optional int32 relay_port = 8;
}

// Inner plaintext wrapper for GroupMessage.ciphertext.
message GroupContent {
  string text_message = 1;
}


// === 3. DHT Peer Discovery Application ===

message DhtEnvelope {
  optional uint32 version = 1;
  oneof message {
    FindNodeRequest find_node_request = 2;
    FindNodeResponse find_node_response = 3;
    PingRequest ping_request = 4;
    PingResponse ping_response = 5;
  }
}

message FindNodeRequest {
  optional uint32 version = 1;
  optional bytes target_peer_id = 2;
}

message NodeInfo {
  optional uint32 version = 1;
  optional bytes peer_id = 2;
  optional string address = 3;
}

message FindNodeResponse {
  optional uint32 version = 1;
  repeated NodeInfo closer_peers = 2;
}

message PingRequest {}
message PingResponse {}

// === 4. Pre-key Exchange Application ===

message PrekeyEnvelope {
  optional uint32 version = 1;
  oneof message {
    SubmitPreKeyBundleRequest submit_pre_key_bundle_request = 2;
    GetPreKeyBundleRequest get_pre_key_bundle_request = 3;
  }
}

// Request to submit a new pre-key bundle to the server.
message SubmitPreKeyBundleRequest {
  message OneTimePreKey {
    optional uint32 version = 1;
    optional bytes id = 2;

    optional bytes public_key = 3;
  }
  
  optional uint32 version = 1;

  optional bytes identity_key = 2;

  optional bytes signed_pre_key_id = 3;

  optional bytes signed_pre_key = 4;

  optional bytes pre_key_signature = 5;

  repeated OneTimePreKey one_time_pre_keys = 6;

  optional google.protobuf.Timestamp expiresUtc = 7;

  optional bytes public_identity_id = 8;
}

// Response for the pre-key bundle submission.
message SubmitPreKeyBundleResponse {
  optional uint32 version = 1;
}

// Request a pre-key bundle by the recipient's PublicIdentityId (UUID).
message GetPreKeyBundleRequest {
  optional uint32 version = 1;
  // PublicIdentityId (UUID bytes) of the recipient
  optional bytes public_identity_id = 2;
}

// Response carrying the pre-key bundle for the requested PKH.
message GetPreKeyBundleResponse {
  message OneTimeKey {
    optional uint32 version = 1;
    optional bytes one_time_key_id = 2;
    optional bytes key_bytes = 3;
  }
  message PreKeyBundle {
    optional uint32 version = 1;    
    optional bytes identity_key = 2;
    optional bytes signed_pre_key_id = 3;
    optional bytes signed_pre_key = 4;
    optional bytes pre_key_signature = 5;
    repeated OneTimeKey one_time_keys = 6;
  }

  message Never {
    optional int32 reason = 1;
  }

  message NotUntil {
    optional google.protobuf.Timestamp not_until_utc = 1;
  }

  optional uint32 version = 1;
  
  oneof message{
    PreKeyBundle pre_key_bundle = 2;  
    Never never = 3;
    NotUntil not_until = 4;
  };
}

// === 5. Message Queue Application ===

message MessageQueueEnvelope {
  optional uint32 version = 1;
  oneof message {
    EnqueueOpaqueMessageRequest enqueue_opaque_message_request = 2;
    FetchQueuedMessagesRequest fetch_queued_messages_request = 3;
  }
}

// Request to enqueue an opaque message for a recipient identified by PublicIdentityId (UUID).
message EnqueueOpaqueMessageRequest {
  optional uint32 version = 1;
  // PublicIdentityId (UUID bytes) of the recipient
  optional bytes recipient_public_identity_id = 2;
  // Opaque encrypted blob (double ratchet ciphertext). Max size enforced by application.
  optional bytes message_blob = 3;
}

// Response for enqueue operation. Placed at top-level InternalEnvelope.
message EnqueueOpaqueMessageResponse {
  optional uint32 version = 1;
  // True when the message was accepted into the queue. False when rejected (e.g., limits exceeded or unknown PublicIdentityId).
  optional bool accepted = 2;
  // If not accepted, a brief error string suitable for logs/diagnostics.
  optional string error = 3;
  // Optional counts for observability (may be omitted by implementations).
  optional uint32 recipient_queued_count = 4;
  optional uint32 total_queued_count = 5;
}

// Request to fetch queued opaque messages for the requesting peer.
// The identity of the requester is derived from the active DirectSession; no fields needed.
message FetchQueuedMessagesRequest {
  optional uint32 version = 1;
  // Optional maximum number of messages to fetch in one batch; server may cap this value.
  optional uint32 max_count = 2;
}

// Response containing zero or more opaque message blobs destined for the requester.
// Placed at top-level InternalEnvelope.
message FetchQueuedMessagesResponse {
  optional uint32 version = 1;
  repeated bytes messages = 2;
}

// === 6. Host Relay Wrapper ===
// The Host uses this to deliver an inner opaque payload on behalf of the logical sender to the destination.
message RelayOpaqueEnvelope {
  optional uint32 version = 100;
  // Privacy-preserving: host does not include or persist sender identity here.
  // The exact opaque payload intended for the destination (e.g., an InternalEnvelope bytes)
  optional bytes opaque_payload = 1;
  // Host-assigned GUID (16 bytes) used for idempotent acknowledgment
  optional bytes message_ack_id = 2;
}

// === 7. Opaque Handshake (Signal-style) ===
// Unsigned initiator hello with plausible deniability. The responder authenticates implicitly via X3DH.
message HandshakeInitiatorHello {
  optional uint32 version = 1;
  // Initiator identity (SPKI bytes)
  optional bytes initiator_identity_key_spki = 2;
  // Initiator ephemeral ECDH public key (SPKI bytes)
  optional bytes initiator_ephemeral_key_spki = 3;
  // References into responder's pre-key store, obtained out-of-band before handshake
  optional bytes signed_pre_key_id = 4;
  optional bytes one_time_pre_key_id = 5;
  // Optional encrypted opaque payload to the recipient (e.g., first message)
  optional bytes encrypted_payload = 6;
  optional bytes initiator_public_identity_id = 7;
}

// === 7.1 Reverse-Signal Handshake Payloads (Protected) ===
// These messages are not exposed to transport metadata. They are intended to be serialized and carried
// inside end-to-end protected fields (e.g., HandshakeInitiatorHello.encrypted_payload).
message ReverseSignalCallbackEndpoint {
  optional uint32 version = 1;
  // Hostname or IP literal.
  optional string host = 2;
  optional uint32 port = 3;
}

message InviteHandshakePreKeyBundle {
  optional uint32 version = 1;


  optional bytes inviter_signed_pre_key = 2;
  optional bytes pre_key_signature = 3;

  optional bytes inviter_one_time_pre_key = 4;
}

message InviteHandshakeRequestPayload {
  optional uint32 version = 1;

  optional string inviter_host = 2;
  optional uint32 inviter_port = 3;
  optional InviteHandshakePreKeyBundle inviter_pre_key = 4;

  optional google.protobuf.Timestamp expires_at_utc = 5;

  // must be unpredictable (GUID). Receiver stores seen request_correlation_id until expires_at_utc and rejects duplicates.
  optional string request_correlation_id = 6;
  optional bytes inviter_public_identity_id = 7;
}

message InviteHandshakeResponse {
  optional uint32 version = 1;
  optional string request_correlation_id = 2;

  // Acceptor acts as X3DH initiator now
  optional bytes acceptor_identity_key = 3;
  optional bytes acceptor_x3dh_ephemeral_key = 4;

  // First ratchet message (header has the acceptor's next ratchet key)
  optional bytes initial_ratchet_message = 5;
  optional bytes acceptor_public_identity_id = 6;
}

// Preferred encrypted inner payload for HandshakeResponderHello
message ResponderInnerHello {
  optional uint32 version = 1;
  optional string direct_session_id = 2;
  optional bytes public_identity_id = 3;
}

// RPC-level acknowledgment for a relayed opaque message. Returned as the plaintext of the
// DeliverOpaqueMessage RPC response (not wrapped inside InternalEnvelope).
message RelayOpaqueResponse {
  optional uint32 version = 1;
  // Echo of the host-assigned message_ack_id (GUID bytes)
  optional bytes message_ack_id = 2;
}
