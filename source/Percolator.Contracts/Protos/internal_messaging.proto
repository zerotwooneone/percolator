syntax = "proto3";

import "google/protobuf/timestamp.proto";

package percolator.contracts;

option csharp_namespace = "Percolator.Contracts";

// The top-level generic envelope for all internal, post-decryption messages.
// It uses a two-level dispatch system: first by application, then by message type.
message InternalEnvelope {
  oneof application_payload {
    ChatEnvelope chat_envelope = 1;
    FileShareEnvelope file_share_envelope = 2;
    DhtEnvelope dht_envelope = 3;
    PrekeyEnvelope prekey_envelope = 4;
    SubmitPreKeyBundleResponse submit_pre_key_bundle_response = 5;
    GetPreKeyBundleResponse get_pre_key_bundle_response = 6;
    MessageQueueEnvelope message_queue_envelope = 7;
    EnqueueOpaqueMessageResponse enqueue_opaque_message_response = 8;
    FetchQueuedMessagesResponse fetch_queued_messages_response = 9;
    // Host relay wrapper carrying inner opaque payload + logical sender identity
    RelayOpaqueEnvelope relay_opaque_envelope = 10;
    // Initiator's unsigned hello (Signal-style plausible deniability)
    HandshakeInitiatorHello handshake_initiator_hello = 11;
  }
}

// === 1. Rich Text Chat Application ===

message ChatEnvelope {
  optional uint32 version = 100; // Top-level version for chat envelope
  oneof message {
    TextMessage text_message = 1;
    ReadReceipt read_receipt = 2;
    EmojiAnnotation emoji_annotation = 3;
    UpdateGroupMembershipRequest update_group_membership_request = 4;
    UpdateGroupInfoRequest update_group_info_request = 5;
    GroupMembershipChangedNotification group_membership_changed_notification = 6;
    GroupInfoChangedNotification group_info_changed_notification = 7;
    DeliveredReceipt delivered_receipt = 8;
    // New administrative and key-rotation messages
    SignedAdminOperation signed_admin_operation = 9;
    SignedKeyAdoptionConfirmation key_adoption_confirmation = 10;
    SignedAdminCommitOperation admin_commit_operation = 11;
    KeyDistributionPayload key_distribution = 12; // sent 1:1 from acting admin to each member
  }
}

message TextMessage {
  bytes message_id = 1; // A unique identifier for the message.
  optional bytes author_identity_key = 2; // Required for group messages.
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  string content = 4;
  // Optional GroupConversationGuid (GUID bytes) for group routing
  optional bytes group_conversation_guid = 5;
  // Optional Public Key Hash (PKH, 32 bytes) for 1:1 routing when no direct session exists (e.g., queued delivery)
  optional bytes public_key_hash = 6;
}

message ReadReceipt {
  bytes message_id = 1; // The ID of the message being acknowledged.
  optional bytes author_identity_key = 2; // Who is acknowledging the message.
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  // Optional GroupConversationGuid (GUID bytes) for group routing
  optional bytes group_conversation_guid = 4;
  // Optional PKH for 1:1 routing when no direct session exists
  optional bytes public_key_hash = 5;
}

message EmojiAnnotation {
  bytes message_id = 1; // The ID of the message being annotated.
  optional bytes author_identity_key = 2; // Who is adding the annotation.
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  string emoji = 4; // The emoji character, e.g., "👍".
  // Optional GroupConversationGuid (GUID bytes) for group routing
  optional bytes group_conversation_guid = 5;
  // Optional PKH for 1:1 routing when no direct session exists
  optional bytes public_key_hash = 6;
}

// Delivery receipt acknowledging that a message was delivered (distinct from read)
message DeliveredReceipt {
  bytes message_id = 1; // The ID of the message being acknowledged as delivered.
  optional bytes author_identity_key = 2; // Who is acknowledging delivery (for group contexts).
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  // Optional GroupConversationGuid (GUID bytes) for group routing
  optional bytes group_conversation_guid = 4;
  // Optional PKH for 1:1 routing when no direct session exists
  optional bytes public_key_hash = 5;
}

// Group Management Messages
message UpdateGroupMembershipRequest {
  repeated bytes members_to_add = 1;
  repeated bytes members_to_remove = 2;
  bool leave_group = 3; // Set to true if the sender is leaving the group.
  // The group to which this update applies
  optional bytes group_conversation_guid = 4;
}

message UpdateGroupInfoRequest {
  optional string new_group_name = 1;
  optional bytes new_group_avatar = 2; // Raw image data for the avatar.
  // The group to which this update applies
  optional bytes group_conversation_guid = 3;
}

// =============================
// Administrative Control Plane
// =============================

// Unsigned payload describing a single administrative operation. The signature is carried in SignedAdminOperation.
message AdminOperationPayload {
  optional uint32 version = 100;
  optional bytes group_conversation_guid = 1; // GUID (16 bytes)
  optional bytes op_id = 2; // GUID (16 bytes) idempotency
  google.protobuf.Timestamp sent_timestamp_utc = 3;
  // Optional sequencing to aid fork/conflict resolution
  optional uint64 admin_sequence_number = 4;

  oneof operation {
    GrantAdmin grant_admin = 10;
    RevokeAdmin revoke_admin = 11;
    UpdateGroupMembershipPayload update_group_membership = 12;
    UpdateGroupInfoPayload update_group_info = 13;
  }
}

message GrantAdmin {
  optional uint32 version = 100;
  optional bytes grantee_public_key = 1; // SPKI bytes
}

message RevokeAdmin {
  optional uint32 version = 100;
  optional bytes grantee_public_key = 1; // SPKI bytes
}

message UpdateGroupMembershipPayload {
  optional uint32 version = 100;
  repeated bytes members_to_add = 1;    // each 16-byte participant guid
  repeated bytes members_to_remove = 2; // each 16-byte participant guid
  optional bool leave_group = 3;
}

message UpdateGroupInfoPayload {
  optional uint32 version = 100;
  optional string new_group_name = 1;
  optional bytes new_group_avatar = 2;
}

message SignedAdminOperation {
  optional uint32 version = 100;
  optional AdminOperationPayload payload = 1; // The canonical bytes to sign are payload.ToByteArray()
  optional bytes signature = 2; // Signature by an admin key (ECDSA P-256 + SHA-256 over payload bytes)
}

// History entries used for newcomer replay/validation
message AdminHistoryEntry {
  optional uint32 version = 100;
  optional AdminOperationPayload payload = 1;
  optional bytes signature = 2;
  optional bytes signer_public_key = 3; // SPKI bytes (redundant but aids audit)
}

message AdminHistoryBundle {
  optional uint32 version = 100;
  repeated AdminHistoryEntry entries = 1; // Ordered from genesis to present
}

// =============================
// Key Rotation Plane (client-orchestrated)
// =============================

// Sent 1:1 by the acting admin to each member. Contains the per-recipient encrypted group key.
message KeyDistributionPayload {
  optional uint32 version = 100;
  optional bytes group_conversation_guid = 1; // 16 bytes
  optional uint32 key_version = 2; // Monotonic per-group version number
  optional bytes encrypted_group_key_for_recipient = 3; // opaque ciphertext
}

// Sent by each member back to the acting admin, acknowledging adoption of key_version.
message SignedKeyAdoptionConfirmation {
  optional uint32 version = 100;
  optional bytes group_conversation_guid = 1; // 16 bytes
  optional uint32 key_version = 2;
  optional bytes adopter_identity_key = 3; // SPKI of adopter identity (or domain-specific identifier)
  google.protobuf.Timestamp sent_timestamp_utc = 4;
  optional bytes signature = 5; // Signature by adopter over the confirmation payload
}

// Broadcast by the acting admin after collecting all confirmations, finalizing the admin op.
message SignedAdminCommitOperation {
  optional uint32 version = 100;
  optional bytes group_conversation_guid = 1; // 16 bytes
  optional bytes op_id = 2; // AdminOperationPayload.op_id being committed
  optional uint32 committed_key_version = 3;
  google.protobuf.Timestamp sent_timestamp_utc = 4;
  optional bytes signature = 5; // Signature by acting admin over commit payload
  optional uint64 admin_sequence_number = 6; // monotonic per-group sequence for first-commit-wins
}

// Group Notification Messages
message GroupMembershipChangedNotification {
  bytes actor_identity_key = 1; // The identity of the member who made the change.
  repeated bytes added_members = 2;
  repeated bytes removed_members = 3;
  optional bytes member_who_left = 4;
  google.protobuf.Timestamp change_timestamp_utc = 5;
  // The group to which this notification applies
  optional bytes group_conversation_guid = 6;
}

message GroupInfoChangedNotification {
  bytes actor_identity_key = 1; // The identity of the member who made the change.
  optional string new_group_name = 2;
  optional bytes new_group_avatar = 3;
  google.protobuf.Timestamp change_timestamp_utc = 4;
  // The group to which this notification applies
  optional bytes group_conversation_guid = 5;
}

// === 2. File Sharing Application ===

message FileShareEnvelope {
  oneof message {
    RequestManifest request_manifest = 1;
    Manifest manifest = 2;
  }
}

message RequestManifest {}

message Manifest {
  message ManifestEntry {
    enum EntryType { FILE = 0; DIRECTORY = 1; }
    EntryType type = 1;
    string path = 2;
    repeated bytes chunk_hashes = 3;
  }
  string manifest_id = 1;
  repeated ManifestEntry entries = 2;
  google.protobuf.Timestamp expires_utc = 3;
  bytes signature = 4;
}

// === 3. DHT Peer Discovery Application ===

message DhtEnvelope {
  optional uint32 version = 1;
  oneof message {
    FindNodeRequest find_node_request = 2;
    FindNodeResponse find_node_response = 3;
    PingRequest ping_request = 4;
    PingResponse ping_response = 5;
  }
}

message FindNodeRequest {
  optional uint32 version = 1;
  optional bytes target_peer_id = 2;
}

message NodeInfo {
  optional uint32 version = 1;
  optional bytes peer_id = 2;
  optional string address = 3;
}

message FindNodeResponse {
  optional uint32 version = 1;
  repeated NodeInfo closer_peers = 2;
}

message PingRequest {}
message PingResponse {}

// === 4. Pre-key Exchange Application ===

message PrekeyEnvelope {
  optional uint32 version = 1;
  oneof message {
    SubmitPreKeyBundleRequest submit_pre_key_bundle_request = 2;
    GetPreKeyBundleRequest get_pre_key_bundle_request = 3;
  }
}

// Request to submit a new pre-key bundle to the server.
message SubmitPreKeyBundleRequest {
  message OneTimePreKey {
    optional uint32 version = 1;
    optional bytes id = 2;

    optional bytes public_key = 3;
  }
  
  optional uint32 version = 1;

  optional bytes identity_key = 2;

  optional bytes signed_pre_key_id = 3;

  optional bytes signed_pre_key = 4;

  optional bytes pre_key_signature = 5;

  repeated OneTimePreKey one_time_pre_keys = 6;

  optional google.protobuf.Timestamp expiresUtc = 7;
}

// Response for the pre-key bundle submission.
message SubmitPreKeyBundleResponse {
  optional uint32 version = 1;
}

// Request a pre-key bundle by the recipient's public key hash (PKH).
message GetPreKeyBundleRequest {
  optional uint32 version = 1;
  // SHA-256 of the recipient's identity signing public key bytes (SPKI)
  optional bytes public_key_hash = 2;
}

// Response carrying the pre-key bundle for the requested PKH.
message GetPreKeyBundleResponse {
  message PreKeyBundle {
    optional uint32 version = 1;
    optional bytes one_time_key_id = 2;
    optional bytes one_time_key = 3;
    optional bytes identity_key = 4;
    optional bytes signed_pre_key_id = 5;
    optional bytes signed_pre_key = 6;
    optional bytes pre_key_signature = 7;
  }

  optional uint32 version = 1;
  
  oneof message{
    PreKeyBundle pre_key_bundle = 2;  
  };
}

// === 5. Message Queue Application ===

message MessageQueueEnvelope {
  optional uint32 version = 1;
  oneof message {
    EnqueueOpaqueMessageRequest enqueue_opaque_message_request = 2;
    FetchQueuedMessagesRequest fetch_queued_messages_request = 3;
  }
}

// Request to enqueue an opaque message for a recipient identified by public key hash (PKH).
message EnqueueOpaqueMessageRequest {
  optional uint32 version = 1;
  // SHA-256 of the recipient's identity signing public key bytes (SPKI)
  optional bytes recipient_public_key_hash = 2;
  // Opaque encrypted blob (double ratchet ciphertext). Max size enforced by application.
  optional bytes message_blob = 3;
}

// Response for enqueue operation. Placed at top-level InternalEnvelope.
message EnqueueOpaqueMessageResponse {
  optional uint32 version = 1;
  // True when the message was accepted into the queue. False when rejected (e.g., limits exceeded or unknown PKH).
  optional bool accepted = 2;
  // If not accepted, a brief error string suitable for logs/diagnostics.
  optional string error = 3;
  // Optional counts for observability (may be omitted by implementations).
  optional uint32 recipient_queued_count = 4;
  optional uint32 total_queued_count = 5;
}

// Request to fetch queued opaque messages for the requesting peer.
// The identity of the requester is derived from the active DirectSession; no fields needed.
message FetchQueuedMessagesRequest {
  optional uint32 version = 1;
  // Optional maximum number of messages to fetch in one batch; server may cap this value.
  optional uint32 max_count = 2;
}

// Response containing zero or more opaque message blobs destined for the requester.
// Placed at top-level InternalEnvelope.
message FetchQueuedMessagesResponse {
  optional uint32 version = 1;
  repeated bytes messages = 2;
}

// === 6. Host Relay Wrapper ===
// The Host uses this to deliver an inner opaque payload on behalf of the logical sender to the destination.
message RelayOpaqueEnvelope {
  optional uint32 version = 100;
  // Privacy-preserving: host does not include or persist sender identity here.
  // The exact opaque payload intended for the destination (e.g., an InternalEnvelope bytes)
  optional bytes opaque_payload = 1;
}

// === 7. Opaque Handshake (Signal-style) ===
// Unsigned initiator hello with plausible deniability. The responder authenticates implicitly via X3DH.
message HandshakeInitiatorHello {
  optional uint32 version = 1;
  // Initiator identity (SPKI bytes)
  optional bytes initiator_identity_key_spki = 2;
  // Initiator ephemeral ECDH public key (SPKI bytes)
  optional bytes initiator_ephemeral_key_spki = 3;
  // References into responder's pre-key store, obtained out-of-band before handshake
  optional bytes signed_pre_key_id = 4;
  optional bytes one_time_pre_key_id = 5;
}

//only ever sent over an encrypted x3dh channel
message HandshakeResponderHello {
  // Wrapper fields
  optional uint32 version = 1;
  // Identity key of the responder, repeated here and inside the signed payload for binding
  optional bytes responder_ephemeral_key = 2;
  // Responder-chosen identifier for the direct session (string mirrors prior session_id usage)
  optional string direct_session_id = 3;
}
