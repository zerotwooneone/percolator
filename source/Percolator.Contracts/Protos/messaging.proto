syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

package Percolator.Contracts.Protos;

option csharp_namespace = "Percolator.Contracts.Protos";

// Main service for all messaging and group management operations
service Messaging {
    // --- Secure Session Management ---
    rpc PublishPreKeyBundle(PublishPreKeyBundleRequest) returns (PublishPreKeyBundleResponse);
    rpc GetPreKeyBundle(GetPreKeyBundleRequest) returns (GetPreKeyBundleResponse);

    // --- Direct Messages ---
    rpc SendPreKeyDirectMessage(SendPreKeyDirectMessageRequest) returns (SendDirectMessageResponse);
    rpc EditDirectMessage(EditMessageRequest) returns (EditMessageResponse); // Note: Assumes session exists
    rpc AnnotateDirectMessage(AnnotateMessageRequest) returns (AnnotateMessageResponse); // Note: Assumes session exists
    rpc RemoveDirectMessageAnnotation(RemoveAnnotationRequest) returns (RemoveAnnotationResponse); // Note: Assumes session exists

    // --- Group Messages ---
    rpc SendGroupMessage(SendGroupMessageRequest) returns (SendGroupMessageResponse);
    rpc EditGroupMessage(EditMessageRequest) returns (EditMessageResponse);
    rpc AnnotateGroupMessage(AnnotateMessageRequest) returns (AnnotateMessageResponse);
    rpc RemoveGroupMessageAnnotation(RemoveAnnotationRequest) returns (RemoveAnnotationResponse);

    // --- Group Management ---
    rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
    rpc AddGroupMember(UpdateGroupMemberRequest) returns (UpdateGroupMemberResponse);
    rpc RemoveGroupMember(UpdateGroupMemberRequest) returns (UpdateGroupMemberResponse);
    rpc RenameGroup(RenameGroupRequest) returns (RenameGroupResponse);
    rpc GetGroupDetails(GetGroupDetailsRequest) returns (Group);
}

// --- Data Models ---

message Group {
    string group_id = 1;
    string name = 2;
    repeated string member_ids = 3;
}

message PreKeyBundle {
    bytes identity_key = 1;
    bytes signed_pre_key = 2;
    bytes one_time_pre_key = 3;
    bytes signed_pre_key_signature = 4;
}

// --- Request/Response Definitions ---

// Direct Messages
message SendPreKeyDirectMessageRequest {
    // The name of the recipient's identity being targeted.
    string identity_name = 1;
    // The initiator's public identity key (IK_A).
    bytes initiator_identity_key = 2;
    // The initiator's public ephemeral key (EK_A).
    bytes initiator_ephemeral_key = 3;
    // The initial encrypted message payload.
    bytes encrypted_payload = 4;
}

message SendDirectMessageResponse {
    bool success = 1;
}

// Secure Session Management
message PublishPreKeyBundleRequest {
    string identity_name = 1;
    PreKeyBundle bundle = 2;
}

message PublishPreKeyBundleResponse {
    bool success = 1;
}

message GetPreKeyBundleRequest {
    string user_id = 1;
    string identity_name = 2;
}

message GetPreKeyBundleResponse {
    PreKeyBundle bundle = 1;
}

// Group Messages
message SendGroupMessageRequest {
    string group_id = 1;
    string content = 2;
}

message SendGroupMessageResponse {
    string message_id = 1;
    google.protobuf.Timestamp timestamp_utc = 2;
}

// Common Edit
message EditMessageRequest {
    string message_id = 1;
    string new_content = 2;
}

message EditMessageResponse {
    bool success = 1;
}

// Common Annotation
message AnnotateMessageRequest {
    string message_id = 1;
    string emoji = 2;
}

message AnnotateMessageResponse {
    bool success = 1;
}

message RemoveAnnotationRequest {
    string message_id = 1;
    string emoji = 2;
}

message RemoveAnnotationResponse {
    bool success = 1;
}

// Group Management
message CreateGroupRequest {
    string name = 1;
    repeated string member_ids = 2;
}

message CreateGroupResponse {
    Group group = 1;
}

message UpdateGroupMemberRequest {
    string group_id = 1;
    string member_id = 2;
}

message UpdateGroupMemberResponse {
    bool success = 1;
}

message RenameGroupRequest {
    string group_id = 1;
    string new_name = 2;
}

message RenameGroupResponse {
    bool success = 1;
}

message GetGroupDetailsRequest {
    string group_id = 1;
}
