syntax = "proto3";

import "google/protobuf/timestamp.proto";

package percolator.contracts;

option csharp_namespace = "Percolator.Contracts";

// Defines the public-facing transport service for establishing secure sessions
// and exchanging opaque, encrypted messages.
service TransportService {
    // Establishes a new secure pairwise session with the node.
    // This is the entry point for the cryptographic handshake.
    rpc EstablishSession(EstablishSessionRequest) returns (EstablishSessionResponse);

    // Creates a new secure group session with a set of initial members.
    rpc CreateGroupSession(CreateGroupSessionRequest) returns (CreateGroupSessionResponse);

    // Delivers an opaque, encrypted message to an established session.
    rpc DeliverOpaqueMessage(DeliverOpaqueMessageRequest) returns (DeliverOpaqueMessageResponse);
}

// Represents the public cryptographic materials needed to establish a secure session.
// The exact fields will depend on the underlying handshake protocol (e.g., X3DH).
message PreKeyBundle {
    // The protocol version.
    optional uint32 version = 1;
    optional bytes identity_agreement_key = 2; // The public identity key for DH agreement.
    optional bytes signed_pre_key = 3;
    optional bytes pre_key_signature = 4;
    optional bytes one_time_pre_key = 5;
    // The public part of the peer's long-term identity signing key (ECDsa).
    optional bytes identity_signing_key = 6;
}

// Request to establish a new secure session.
message EstablishSessionRequest {
    // The protocol version.
    optional uint32 version = 1;
    // The initiator's pre-key bundle.
    optional PreKeyBundle initiator_bundle = 2;
    // The initiator's ephemeral public key for this handshake.
    optional bytes initiator_ephemeral_key = 3;
}

// Response containing the responder's key bundle and the new session ID.
message EstablishSessionResponse {
    // The protocol version.
    optional uint32 version = 1;
    // The session ID for the newly established session.
    optional string session_id = 2;
    // The responder's pre-key bundle.
    optional PreKeyBundle responder_bundle = 3;
    // If the request is rejected, this field may be set to indicate when the client should try again.
    optional google.protobuf.Timestamp retry_after_utc = 4;
}

// Request to create a new group session.
message CreateGroupSessionRequest {
    optional uint32 version = 1;
    optional PreKeyBundle initiator_bundle = 2;
    // The key bundles for all other initial members of the group.
    repeated PreKeyBundle initial_members = 3;
}

// Response for a group session creation request.
message CreateGroupSessionResponse {
    optional uint32 version = 1;
    optional string session_id = 2;
    optional google.protobuf.Timestamp retry_after_utc = 3;
}

// Request to deliver an opaque message to a session.
message DeliverOpaqueMessageRequest {
    optional uint32 version = 1;
    optional string session_id = 2;
    // The opaque, encrypted message payload. The transport service has no
    // knowledge of the contents of this payload.
    optional bytes payload = 3;
}

// An empty response to acknowledge the message delivery request.
message DeliverOpaqueMessageResponse {
    optional uint32 version = 1;
    optional google.protobuf.Timestamp retry_after_utc = 2;
}

// Defines the structured format for a ratchet message used in Double Ratchet encryption.
message RatchetMessage {
    // The protocol version.
    optional int32 version = 1;
    // The header containing metadata for decryption.
    optional RatchetHeader header = 2;
    // The encrypted message payload.
    optional bytes ciphertext = 3;
}

// The header for a ratchet message, containing metadata needed for decryption.
message RatchetHeader {
    // The ephemeral ratchet key used for this message.
    optional bytes ratchet_key = 1;
    // The message counter in the current sending chain.
    optional uint64 counter = 2;
    // The number of messages in the previous sending chain.
    optional uint64 previous_chain_length = 3;
}