syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "internal_messaging.proto";

package percolator.contracts;

option csharp_namespace = "Percolator.Contracts";

// Defines the public-facing transport service for establishing secure sessions
// and exchanging opaque, encrypted messages.
service TransportService {
    // Establishes a new secure pairwise session with the node.
    // This is the entry point for the cryptographic handshake.
    rpc EstablishSession(EstablishSessionRequest) returns (EstablishSessionResponse);

    // Creates a new secure group session with a set of initial members.
    rpc CreateGroupSession(CreateGroupSessionRequest) returns (CreateGroupSessionResponse);

    // Delivers an opaque, encrypted message to an established session.
    rpc DeliverOpaqueMessage(DeliverOpaqueMessageRequest) returns (DeliverOpaqueMessageResponse);

    // Establishes a new secure pairwise session with the node.
    // This is the entry point for the cryptographic handshake.
    rpc EstablishDirectSession(EstablishDirectSessionRequest) returns (EstablishDirectSessionResponse);

    // Reverse-signal handshake response delivery (inviter receives acceptor's response).
    rpc DeliverInviteHandshakeResponse(InviteHandshakeResponse) returns (DeliverInviteHandshakeResponseAck);

    // Requests a delivery certificate from the relay for sealed sender authentication.
    rpc GetDeliveryCertificate(GetDeliveryCertificateRequest) returns (GetDeliveryCertificateResponse);

    // Provisions a new group on the Relay's encrypted ledger.
    rpc ProvisionRelayGroup(ProvisionRelayGroupRequest) returns (ProvisionRelayGroupResponse);

    // Publishes a message to a group on the Relay's encrypted ledger.
    rpc PublishGroupMessage(PublishGroupMessageRequest) returns (PublishGroupMessageResponse);
}

message DeliverInviteHandshakeResponseAck {
    optional uint32 version = 1;
}

// Delivery certificate for sealed sender authentication
message DeliveryCertificate {
    optional uint32 version = 1;
    optional bytes certificate_data = 2;
    optional bytes signature = 3;
}

// Request to get a delivery certificate from the relay
message GetDeliveryCertificateRequest {
    optional uint32 version = 1;
}

// Response containing the delivery certificate
message GetDeliveryCertificateResponse {
    optional uint32 version = 1;
    optional DeliveryCertificate certificate = 2;
}

// Request to provision a new group on the Relay's encrypted ledger
message ProvisionRelayGroupRequest {
    optional uint32 version = 1;
    optional bytes conversation_id = 2;
    optional bytes group_public_params = 3;
    repeated bytes initial_routing_tokens = 4;
}

// Response for group provisioning
message ProvisionRelayGroupResponse {
    enum Status {
        SUCCESS = 0;
        ALREADY_EXISTS = 1;
    }
    optional uint32 version = 1;
    Status status = 2;
}

// Request to publish a message to a group on the Relay's encrypted ledger
message PublishGroupMessageRequest {
    optional uint32 version = 1;
    optional bytes conversation_id = 2;
    optional bytes ciphertext = 3;
    optional uint32 epoch = 4;
    optional bytes zk_auth_presentation = 5;
    optional uint64 redemption_time = 6;
}

// Response for group message publishing
message PublishGroupMessageResponse {
    enum Status {
        SUCCESS = 0;
        EPOCH_CONFLICT = 1;
        UNAUTHORIZED = 2;
    }
    optional uint32 version = 1;
    Status status = 2;
    optional uint32 current_relay_epoch = 3;
}

// Represents the public cryptographic materials needed to establish a secure session.
// The exact fields will depend on the underlying handshake protocol (e.g., X3DH).
message PreKeyBundle {
    // The protocol version.
    optional uint32 version = 1;
    optional bytes signed_payload = 2;
    optional bytes payload_signature = 3;
    optional bytes one_time_pre_key = 4;
    // The public part of the peer's long-term identity signing key (ECDsa).
    optional bytes identity_signing_key = 5;
    // The date and time when this bundle expires.
    optional google.protobuf.Timestamp expiration_date_utc = 6;
}

// The request to establish a new secure pairwise session with the node.
// This is the entry point when the remote peer has our prekey bundle
message EstablishSessionRequest {
    optional uint32 version = 1;

    optional bytes identity_signing_key = 2;
    optional bytes ephemeral_key = 3;
    optional bytes prekey_id = 4;
    optional bytes onetime_prekey_id = 5;
}

message EstablishSessionResponse {
    message Never {
        optional uint32 version = 1;
    }
    message Response {
        message ResponsePayload {
            optional uint32 version = 1;

            optional bytes ephemeral_key = 2;
            optional string session_id = 3;
        }
        optional uint32 version = 1;

        optional bytes identity_signing_key = 2;
        optional bytes response_payload = 3;
        optional bytes payload_signature = 4;
    }
    message NotBefore {
        optional uint32 version = 1;
        // If the request is rejected, this field may be set to indicate when the client should try again.
        optional google.protobuf.Timestamp retry_after_utc = 2;
    }
    
    optional uint32 version = 1;
    oneof message {
        Never never=2;
        Response response=3;
        NotBefore not_before=4;        
    }    
}

message EstablishDirectSessionRequest {
    // The protocol version.
    optional uint32 version = 1;

    // Reverse-signal invite ingress.
    // Inviter identity key (SPKI bytes)
    optional bytes inviter_identity_key = 2;

    // Always a serialized InviteHandshakeRequestPayload
    optional bytes payload = 3;

    // Signed by inviter_identity_key over raw payload bytes
    optional bytes payload_signature = 4;
}

message EstablishDirectSessionResponse {
    message Never {}
    message Queued {
        optional uint32 version = 1;
        // Echo of InviteHandshakeRequestPayload.request_correlation_id for sender correlation.
        optional string request_correlation_id = 2;
    }
    message ResponsePayload {
        optional uint32 version = 1;

        // returned in Response.ratchet_message
        optional InternalEnvelope inner_envelope = 2;
        optional string session_id = 4;
    }
    message Response {
        optional uint32 version = 1;

        // initiator's identity signing key (SPKI)
        optional bytes initiator_identity_key = 2;
        // The initiator's first Double Ratchet message to the responder. The header contains the ratchet DH public key.
        optional bytes ratchet_message = 3;
        // Initiator's X3DH ephemeral public key used to derive the shared secret (for responder to complete X3DH)
        optional bytes initiator_ephemeral_key = 4;
    }
  message NotBefore {
    // The protocol version.
    optional uint32 version = 1;
    // If the request is rejected, this field may be set to indicate when the client should try again.
    optional google.protobuf.Timestamp retry_after_utc = 2;
  }

    // The protocol version.
    optional uint32 version = 1;
    oneof message {
        Never never = 2;
        Response response = 3;
        NotBefore not_before = 4;
        Queued queued = 5;
    }
}

// Request to create a new group session.
message CreateGroupSessionRequest {
    optional uint32 version = 1;
    optional PreKeyBundle initiator_bundle = 2;
    // The key bundles for all other initial members of the group.
    repeated PreKeyBundle initial_members = 3;
}

// Response for a group session creation request.
message CreateGroupSessionResponse {
    optional uint32 version = 1;
    optional string session_id = 2;
    optional google.protobuf.Timestamp retry_after_utc = 3;
}

// Request to deliver an opaque message to a session.
message DeliverOpaqueMessageRequest {
    optional uint32 version = 1;
    // The opaque, encrypted message payload. The transport service has no
    // knowledge of the contents of this payload.
    optional bytes payload = 3;
}

// An empty response to acknowledge the message delivery request.
message DeliverOpaqueMessageResponse {
    message Never {
        optional uint32 version = 1;
    }
    message NotUntil {
        optional uint32 version = 1;
        optional google.protobuf.Timestamp retry_after_utc = 2;
    }
    message Payload {
      optional uint32 version = 1;
      optional bytes response_payload = 3;
    }


    optional uint32 version = 1;
    oneof result {
        Never never = 2;
        NotUntil not_until = 3;
        // application specific response that is opaque to the transport layer
        Payload response_payload = 4;
    }
}

// Defines the structured format for a ratchet message used in Double Ratchet encryption.
message RatchetMessage {
    // The protocol version.
    optional int32 version = 1;
    // The header containing metadata for decryption.
    optional RatchetHeader header = 2;
    // The encrypted message payload.
    optional bytes ciphertext = 3;
}

// The header for a ratchet message, containing metadata needed for decryption.
message RatchetHeader {
    // The ephemeral ratchet key used for this message.
    optional bytes ratchet_key = 1;
    // The message counter in the current sending chain.
    optional uint64 counter = 2;
    // The number of messages in the previous sending chain.
    optional uint64 previous_chain_length = 3;
}