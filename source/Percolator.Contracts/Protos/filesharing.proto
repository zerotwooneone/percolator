syntax = "proto3";

import "Protos/manifest.proto";

option csharp_namespace = "Percolator.Contracts.Protos";

// The service definition for file sharing.
service FileSharing {
  // Announce that a manifest is available for download
  rpc AnnounceManifest (AnnounceManifestRequest) returns (AnnounceManifestResponse);

  // Request a specific manifest from a peer
  rpc RequestManifest (RequestManifestRequest) returns (RequestManifestResponse);

  // Download a chunk of a file
  rpc DownloadChunk (DownloadChunkRequest) returns (stream DownloadChunkResponse);
}

message AnnounceManifestRequest {
    // The SHA256 hash of the manifest content, used as a unique identifier.
    optional bytes manifest_hash = 1;
    // The full signed manifest object.
    optional SignedManifest signed_manifest = 2;
}

message AnnounceManifestResponse {
    // Whether the manifest was accepted.
    optional bool success = 1;
    // An optional message, e.g., an error reason.
    optional string message = 2;
}

message RequestManifestRequest {
    // The hash of the manifest being requested.
    optional bytes manifest_hash = 1;
}

message RequestManifestResponse {
    // The signed manifest, using the definition from manifest.proto.
    optional SignedManifest signed_manifest = 1;
}

message DownloadChunkRequest {
    optional bytes manifest_hash = 1;
    optional string file_path = 2;
    optional int64 chunk_offset = 3;
    optional int32 chunk_size = 4;
}

message DownloadChunkResponse {
    optional bytes chunk_data = 1;
}
